<text x="1071.0" y="148.0" class="cot" text-anchor="middle">1</text>
<text x="1092.0" y="148.0" class="note" text-anchor="start">440 W × 430 H × 150 D body. 406 L × 114 D × 106 H</text>
<text x="1092.0" y="168.0" class="note" text-anchor="start">cassette; clear bay 414 × 122 × 110.</text>
<circle cx="1071.0" cy="191.0" r="11" class="co"/>
<text x="1071.0" y="196.0" class="cot" text-anchor="middle">2</text>
<text x="1092.0" y="196.0" class="note" text-anchor="start">Clear hatch 118 D × 110 H after zip and lining intrusion.</text>
<text x="1092.0" y="216.0" class="note" text-anchor="start">End-frame load path must route around hatch, not cross</text>
<text x="1092.0" y="236.0" class="note" text-anchor="start">extraction path.</text>
<circle cx="1071.0" cy="259.0" r="11" class="co"/>
<text x="1071.0" y="264.0" class="cot" text-anchor="middle">3</text>
<text x="1092.0" y="264.0" class="note" text-anchor="start">Base stack: 10 cradle + 106 cassette + 4 clearance + 4</text>
<text x="1092.0" y="284.0" class="note" text-anchor="start">barrier + 6 impact pad + 12 free gap + 272 padded sleeve +</text>
<text x="1092.0" y="304.0" class="note" text-anchor="start">16 top = 430.</text>
<circle cx="1071.0" cy="327.0" r="11" class="co"/>
<text x="1071.0" y="332.0" class="cot" text-anchor="middle">4</text>
<text x="1092.0" y="332.0" class="note" text-anchor="start">Suspended sleeve clear 370 × 260 × 25; outer 382 × 272 ×</text>
<text x="1092.0" y="352.0" class="note" text-anchor="start">37. Replaceable pads. Test hard bottom-out with a</text>
<text x="1092.0" y="372.0" class="note" text-anchor="start">surrogate, not a real laptop.</text>
<circle cx="1071.0" cy="395.0" r="11" class="co"/>
<text x="1071.0" y="400.0" class="cot" text-anchor="middle">5</text>
<text x="1092.0" y="400.0" class="note" text-anchor="start">Frame-mounted modular fabric or standard rigid handle.</text>
<text x="1092.0" y="420.0" class="note" text-anchor="start">Captive bolts POC. Double weight handle meaning/geometry</text>
<text x="1092.0" y="440.0" class="note" text-anchor="start">TBD; see sheet 3.</text>
<circle cx="1071.0" cy="463.0" r="11" class="co"/>
<text x="1071.0" y="468.0" class="cot" text-anchor="middle">6</text>
<text x="1092.0" y="468.0" class="note" text-anchor="start">Supported single cassette vs two smaller cassettes stays</text>
<text x="1092.0" y="488.0" class="note" text-anchor="start">OPEN. Split loses continuous long-bar fit. Neither is a</text>
<text x="1092.0" y="508.0" class="note" text-anchor="start">final mechanism decision.</text>
<circle cx="1071.0" cy="531.0" r="11" class="co"/>
<text x="1071.0" y="536.0" class="cot" text-anchor="middle">7</text>
<text x="1092.0" y="536.0" class="note" text-anchor="start">88 mm stack + 4 clamp + 6 reserve. Two full + one half =</text>
<text x="1092.0" y="556.0" class="note" text-anchor="start">6.25 kg/module; four = 25 kg, over example 24 kg</text>
<text x="1092.0" y="576.0" class="note" text-anchor="start">allowance.</text>
<circle cx="1071.0" cy="599.0" r="11" class="co"/>
<text x="1071.0" y="604.0" class="cot" text-anchor="middle">8</text>
<text x="1092.0" y="604.0" class="note" text-anchor="start">8 full + 3 half = 23.75 kg nominal example. Actual</text>
<text x="1092.0" y="624.0" class="note" text-anchor="start">complete mass, including tray and handle, must be ≤30 kg.</text>
<text x="1092.0" y="644.0" class="note" text-anchor="start">No automatic volume limiter.</text>
<text x="60.0" y="1090.0" class="lbl" text-anchor="start">PROVISIONAL PACKAGING ONLY — NOT ENGINEERING VALIDATED</text>

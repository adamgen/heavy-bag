<text x="1170.0" y="824.0" class="note" text-anchor="start">Aluminium frame (6061-T6)</text>
<g transform="translate(1110,845)"><rect x="0" y="-8" width="46" height="16" class="pe"/></g>
<text x="1170.0" y="850.0" class="note" text-anchor="start">HDPE sheet / moulded plastic</text>
<g transform="translate(1110,871)"><rect x="0" y="-8" width="46" height="16" class="wt"/></g>
<text x="1170.0" y="876.0" class="note" text-anchor="start">Weights</text>

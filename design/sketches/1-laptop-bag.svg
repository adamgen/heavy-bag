<text x="70.0" y="855.0" class="cot" text-anchor="middle">13</text>
<text x="320.0" y="1080.0" class="lbl" text-anchor="middle">TOP VIEW</text>
<text x="1110.0" y="70.0" class="lbl" text-anchor="start">LAPTOP BAG — “HEAVY BRIEF” (working name)</text>
<text x="1142.0" y="100.0" class="note" text-anchor="start">One-hand suitcase carry, up to 30 kg total (bag + 16"</text>
<text x="1142.0" y="120.0" class="note" text-anchor="start">laptop + contents + up to 24 kg weights). Must hang</text>
<text x="1142.0" y="140.0" class="note" text-anchor="start">straight and feel the same in either hand.</text>
<circle cx="1121.0" cy="163.0" r="11" class="co"/>
<text x="1121.0" y="168.0" class="cot" text-anchor="middle">1</text>
<text x="1142.0" y="168.0" class="note" text-anchor="start">Rigid top handle, ~30 mm grip, bolted/riveted to the</text>
<text x="1142.0" y="188.0" class="note" text-anchor="start">aluminium bridge (11). Not sewn-only. Rated 90 kg static.</text>
<circle cx="1121.0" cy="211.0" r="11" class="co"/>
<text x="1121.0" y="216.0" class="cot" text-anchor="middle">2</text>
<text x="1142.0" y="216.0" class="note" text-anchor="start">Aluminium U-frame: top bridge + one stay in each end panel</text>
<text x="1142.0" y="236.0" class="note" text-anchor="start">+ bottom cradle under the tray. All load goes handle →</text>
<text x="1142.0" y="256.0" class="note" text-anchor="start">frame → tray.</text>
<circle cx="1121.0" cy="279.0" r="11" class="co"/>
<text x="1121.0" y="284.0" class="cot" text-anchor="middle">3</text>
<text x="1142.0" y="284.0" class="note" text-anchor="start">16" MacBook Pro (356 × 248 × 17 mm) in padded sleeve</text>
<text x="1142.0" y="304.0" class="note" text-anchor="start">against back wall (9).</text>
<circle cx="1121.0" cy="327.0" r="11" class="co"/>
<text x="1121.0" y="332.0" class="cot" text-anchor="middle">4</text>
<text x="1142.0" y="332.0" class="note" text-anchor="start">Weight tray in a 100 mm base band, centred under the</text>
<text x="1142.0" y="352.0" class="note" text-anchor="start">handle. 4 modules of 95 × 100 mm; full 24 kg with steel</text>
<text x="1142.0" y="372.0" class="note" text-anchor="start">bricks or steel bar. See sheet 3.</text>
<circle cx="1121.0" cy="395.0" r="11" class="co"/>
<text x="1121.0" y="400.0" class="cot" text-anchor="middle">5</text>
<text x="1142.0" y="400.0" class="note" text-anchor="start">Rigid HDPE false floor separates the weights from laptop</text>
<text x="1142.0" y="420.0" class="note" text-anchor="start">and contents.</text>
<circle cx="1121.0" cy="443.0" r="11" class="co"/>
<text x="1121.0" y="448.0" class="cot" text-anchor="middle">6</text>
<text x="1142.0" y="448.0" class="note" text-anchor="start">Front organiser pocket, zipped.</text>
<circle cx="1121.0" cy="471.0" r="11" class="co"/>
<text x="1121.0" y="476.0" class="cot" text-anchor="middle">7</text>
<text x="1142.0" y="476.0" class="note" text-anchor="start">Tray slides out of a zipped hatch in one end panel, on</text>
<text x="1142.0" y="496.0" class="note" text-anchor="start">HDPE runners. Tray end cap has a pull grip.</text>
<circle cx="1121.0" cy="519.0" r="11" class="co"/>
<text x="1121.0" y="524.0" class="cot" text-anchor="middle">8</text>
<text x="1142.0" y="524.0" class="note" text-anchor="start">Two-step release: open hatch zip, then press latch and</text>
<text x="1142.0" y="544.0" class="note" text-anchor="start">pull. Tray can't fall out by accident.</text>
<circle cx="1121.0" cy="567.0" r="11" class="co"/>
<text x="1121.0" y="572.0" class="cot" text-anchor="middle">10</text>
<text x="1142.0" y="572.0" class="note" text-anchor="start">Clamp plate + 2 cam straps press any stack (10–85 mm) to</text>
<text x="1142.0" y="592.0" class="note" text-anchor="start">stop rattle.</text>
<circle cx="1121.0" cy="615.0" r="11" class="co"/>
<text x="1121.0" y="620.0" class="cot" text-anchor="middle">12</text>
<text x="1142.0" y="620.0" class="note" text-anchor="start">Four protective base feet.</text>
<circle cx="1121.0" cy="643.0" r="11" class="co"/>
<text x="1121.0" y="648.0" class="cot" text-anchor="middle">13</text>
<text x="1142.0" y="648.0" class="note" text-anchor="start">Main zip, 2-way, heavy coil, runs over the top.</text>
<text x="1142.0" y="676.0" class="note" text-anchor="start">Detachable shoulder strap clips to the two D-rings.</text>
<text x="1110.0" y="716.0" class="lbl" text-anchor="start">LEGEND</text>

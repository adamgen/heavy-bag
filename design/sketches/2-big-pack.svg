<text x="73.0" y="1006.0" class="dt" text-anchor="middle" transform="rotate(-90 73.0 1006.0)">312</text>
<text x="440.0" y="890.0" class="lbl" text-anchor="start">Weight carrier (front, 1:4)</text>
<text x="440.0" y="924.0" class="note" text-anchor="start">3 × 3 modules of 95 × 100 mm (sheet 3).</text>
<text x="440.0" y="946.0" class="note" text-anchor="start">Up to 9 steel bricks × 2.5 kg = 22.5 kg,</text>
<text x="440.0" y="968.0" class="note" text-anchor="start">plus a half-brick layer to reach 24 kg.</text>
<text x="440.0" y="990.0" class="note" text-anchor="start">Dashed: standard ruck plate 229 × 292 mm</text>
<text x="440.0" y="1012.0" class="note" text-anchor="start">fits the same sleeve (carrier removed).</text>
<text x="440.0" y="1034.0" class="note" text-anchor="start">Lifts out by the pull loop through slot (7).</text>
<text x="1150.0" y="70.0" class="lbl" text-anchor="start">BACKPACK — “BIG PACK”</text>
<text x="1182.0" y="100.0" class="note" text-anchor="start">Same 30 kg total rating and one-hand suitcase carry as the</text>
<text x="1182.0" y="120.0" class="note" text-anchor="start">laptop bag. Worn as a backpack it's a rest mode (or</text>
<text x="1182.0" y="140.0" class="note" text-anchor="start">rucking).</text>
<circle cx="1161.0" cy="163.0" r="11" class="co"/>
<text x="1161.0" y="168.0" class="cot" text-anchor="middle">1</text>
<text x="1182.0" y="168.0" class="note" text-anchor="start">Rigid top handle on the aluminium bridge (11), placed over</text>
<text x="1182.0" y="188.0" class="note" text-anchor="start">the loaded centre of mass — close to the back panel, not</text>
<text x="1182.0" y="208.0" class="note" text-anchor="start">mid-bag.</text>
<circle cx="1161.0" cy="231.0" r="11" class="co"/>
<text x="1161.0" y="236.0" class="cot" text-anchor="middle">2</text>
<text x="1182.0" y="236.0" class="note" text-anchor="start">Two aluminium stays in the back panel, joined by the top</text>
<text x="1182.0" y="256.0" class="note" text-anchor="start">bridge and a bottom cradle; HDPE frame sheet between them.</text>
<circle cx="1161.0" cy="279.0" r="11" class="co"/>
<text x="1161.0" y="284.0" class="cot" text-anchor="middle">3</text>
<text x="1182.0" y="284.0" class="note" text-anchor="start">16" MacBook Pro in padded sleeve, in front of the weight</text>
<text x="1182.0" y="304.0" class="note" text-anchor="start">sleeve.</text>
<circle cx="1161.0" cy="327.0" r="11" class="co"/>
<text x="1161.0" y="332.0" class="cot" text-anchor="middle">4</text>
<text x="1182.0" y="332.0" class="note" text-anchor="start">Weight carrier sits low in a sleeve against the frame</text>
<text x="1182.0" y="352.0" class="note" text-anchor="start">sheet: weight closest to the spine.</text>
<circle cx="1161.0" cy="375.0" r="11" class="co"/>
<text x="1161.0" y="380.0" class="cot" text-anchor="middle">5</text>
<text x="1182.0" y="380.0" class="note" text-anchor="start">Frame sheet and stays carry the load to the bottom cradle.</text>
<circle cx="1161.0" cy="403.0" r="11" class="co"/>
<text x="1161.0" y="408.0" class="cot" text-anchor="middle">6</text>
<text x="1182.0" y="408.0" class="note" text-anchor="start">Front organiser pocket.</text>
<circle cx="1161.0" cy="431.0" r="11" class="co"/>
<text x="1161.0" y="436.0" class="cot" text-anchor="middle">7</text>
<text x="1182.0" y="436.0" class="note" text-anchor="start">Top-loading weight slot: zip across the top of the back</text>
<text x="1182.0" y="456.0" class="note" text-anchor="start">panel; carrier lifts out by its pull loop.</text>
<circle cx="1161.0" cy="479.0" r="11" class="co"/>
<text x="1161.0" y="484.0" class="cot" text-anchor="middle">8</text>
<text x="1182.0" y="484.0" class="note" text-anchor="start">Two-step release: buckle tab over the zip pull, then</text>
<text x="1182.0" y="504.0" class="note" text-anchor="start">unzip.</text>
<circle cx="1161.0" cy="527.0" r="11" class="co"/>
<text x="1161.0" y="532.0" class="cot" text-anchor="middle">9</text>
<text x="1182.0" y="532.0" class="note" text-anchor="start">Shoulder straps tuck behind a zip panel during the hand</text>
<text x="1182.0" y="552.0" class="note" text-anchor="start">carry — nothing dangles when switching hands.</text>
<circle cx="1161.0" cy="575.0" r="11" class="co"/>
<text x="1161.0" y="580.0" class="cot" text-anchor="middle">10</text>
<text x="1182.0" y="580.0" class="note" text-anchor="start">Carrier holds 3 × 3 bricks, ruck plates, fill-your-own</text>
<text x="1182.0" y="600.0" class="note" text-anchor="start">shells or flat plates; cam strap clamps it.</text>
<circle cx="1161.0" cy="623.0" r="11" class="co"/>
<text x="1161.0" y="628.0" class="cot" text-anchor="middle">12</text>
<text x="1182.0" y="628.0" class="note" text-anchor="start">Strap anchors, lumbar pad and base feet.</text>
<text x="1150.0" y="668.0" class="lbl" text-anchor="start">LEGEND</text>

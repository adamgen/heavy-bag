<line x1="110.0" y1="826.0" x2="417.0" y2="826.0" class="d" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="263.5" y="820.0" class="dt" text-anchor="middle">307</text>
<text x="263.5" y="987.0" class="sm" text-anchor="middle">3 × 3 grid; diagram cropped to one row</text>
<text x="470.0" y="860.0" class="lbl" text-anchor="start">Carrier overall 307 W × 322 H × 66 D</text>
<text x="470.0" y="890.0" class="sm" text-anchor="start">Clear cavity 299 × 314 × 58; 53 stack +4 clamp +1 reserve.</text>
<text x="470.0" y="915.0" class="sm" text-anchor="start">Bay 319 × 334 × 78. Side structure/textile 20.5 each.</text>
<text x="470.0" y="940.0" class="sm" text-anchor="start">LOW bottom36 / top358; MID-LOW bottom66 / top388.</text>
<text x="470.0" y="965.0" class="sm" text-anchor="start">Separate fixed layouts, no adjustable slider in POC.</text>
<text x="470.0" y="990.0" class="sm" text-anchor="start">9 × 2.5 =22.5 kg; +1 ×1.25 =23.75 kg, not24.</text>
<text x="470.0" y="1015.0" class="sm" text-anchor="start">Heavy top-lift: grounded bag, two grips, rig-test first.</text>
<text x="1060.0" y="70.0" class="lbl" text-anchor="start">BACKPACK — BIG PACK</text>
<text x="1092.0" y="100.0" class="note" text-anchor="start">30 kg complete mass ceiling; start lighter. Hand carry</text>
<text x="1092.0" y="120.0" class="note" text-anchor="start">first; worn mode is secondary, not primary rucking.</text>
<circle cx="1071.0" cy="143.0" r="11" class="co"/>
<text x="1071.0" y="148.0" class="cot" text-anchor="middle">1</text>
<text x="1092.0" y="148.0" class="note" text-anchor="start">360 W × 500 H × 190 D body. Carrier 307 × 322 × 66. Old</text>
<text x="1092.0" y="168.0" class="note" text-anchor="start">310-wide bag / 300-high zone did not allow finished parts</text>
<text x="1092.0" y="188.0" class="note" text-anchor="start">and frame.</text>
<circle cx="1071.0" cy="211.0" r="11" class="co"/>
<text x="1071.0" y="216.0" class="cot" text-anchor="middle">2</text>
<text x="1092.0" y="216.0" class="note" text-anchor="start">Low vs fixed mid-low is a PROPOSAL comparison, not a</text>
<text x="1092.0" y="236.0" class="note" text-anchor="start">selected position. Compare hand tilt and shoulder pressure</text>
<text x="1092.0" y="256.0" class="note" text-anchor="start">at equal total mass.</text>
<circle cx="1071.0" cy="279.0" r="11" class="co"/>
<text x="1071.0" y="284.0" class="cot" text-anchor="middle">3</text>
<text x="1092.0" y="284.0" class="note" text-anchor="start">Back-to-front: 18 pad/frame + 78 bay + 4 barrier + 12 gap</text>
<text x="1092.0" y="304.0" class="note" text-anchor="start">+ 37 sleeve + 41 main/front =190. Gap includes 6</text>
<text x="1092.0" y="324.0" class="note" text-anchor="start">replaceable pads, 6 free.</text>
<circle cx="1071.0" cy="347.0" r="11" class="co"/>
<text x="1071.0" y="352.0" class="cot" text-anchor="middle">4</text>
<text x="1092.0" y="352.0" class="note" text-anchor="start">Portrait laptop sleeve clear 260 W × 370 H × 25 D; padded</text>
<text x="1092.0" y="372.0" class="note" text-anchor="start">outer 272 × 382 × 37. Bottom32: 14 base +6 pad +12 free</text>
<text x="1092.0" y="392.0" class="note" text-anchor="start">gap.</text>
<circle cx="1071.0" cy="415.0" r="11" class="co"/>
<text x="1071.0" y="420.0" class="cot" text-anchor="middle">5</text>
<text x="1092.0" y="420.0" class="note" text-anchor="start">Suspend sleeve; test lateral and base impact with</text>
<text x="1092.0" y="440.0" class="note" text-anchor="start">surrogate. No load transfer from carrier or frame to</text>
<text x="1092.0" y="460.0" class="note" text-anchor="start">laptop.</text>
<circle cx="1071.0" cy="483.0" r="11" class="co"/>
<text x="1071.0" y="488.0" class="cot" text-anchor="middle">6</text>
<text x="1092.0" y="488.0" class="note" text-anchor="start">Stow harness for hand carry. Top-loading carrier path,</text>
<text x="1092.0" y="508.0" class="note" text-anchor="start">zipped opening and retention need real-part insertion</text>
<text x="1092.0" y="528.0" class="note" text-anchor="start">tests. Two lifting grips stow inside carrier envelope.</text>
<circle cx="1071.0" cy="551.0" r="11" class="co"/>
<text x="1071.0" y="556.0" class="cot" text-anchor="middle">7</text>
<text x="1092.0" y="556.0" class="note" text-anchor="start">Modular handle receivers and captive-bolt POC swaps.</text>
<text x="1092.0" y="576.0" class="note" text-anchor="start">Double variant TBD. Handle location must be checked</text>
<text x="1092.0" y="596.0" class="note" text-anchor="start">against actual loaded CoM, not guessed.</text>
<circle cx="1071.0" cy="619.0" r="11" class="co"/>
<text x="1071.0" y="624.0" class="cot" text-anchor="middle">8</text>
<text x="1092.0" y="624.0" class="note" text-anchor="start">Grid insert removable for compatible flat plates. Finished</text>
<text x="1092.0" y="644.0" class="note" text-anchor="start">stack ≤53 incl. coating/separators; check actual SKU. Not</text>
<text x="1092.0" y="664.0" class="note" text-anchor="start">every weight source reaches24 kg.</text>
<text x="60.0" y="1090.0" class="lbl" text-anchor="start">PROVISIONAL PACKAGING ONLY — NOT ENGINEERING VALIDATED</text>
<text x="60.0" y="1118.0" class="sm" text-anchor="start">Blue: dimensions · orange: frame/receivers · green: barrier/enclosure · grey: weight</text>
<text x="60.0" y="1143.0" class="sm" text-anchor="start">SVG / PNG / PDF exports regenerated from current generator. See tech-pack v0.2.</text>

<text x="845.0" y="802.0" class="lbl" text-anchor="middle">SECTION — 1:4</text>
<text x="845.0" y="205.0" class="sm" text-anchor="middle">Back at left; laptop portrait</text>
<text x="890.0" y="690.0" class="sm" text-anchor="middle" transform="rotate(-90 890.0 690.0)">12 free above base pad</text>
<rect x="110.0" y="850.0" width="307.0" height="161.0" rx="0" class="pe"/>

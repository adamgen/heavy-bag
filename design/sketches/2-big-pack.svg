<text x="1074.0" y="1072.0" class="lbl" text-anchor="start">HEAVY BAG — BIG PACK</text>
<text x="1074.0" y="1112.0" class="note" text-anchor="start">Product-design / POC revision v0.2</text>
<text x="1074.0" y="1138.0" class="sm" text-anchor="start">Concept sketch · dims in mm · confirm with sample</text>
<text x="1474.0" y="1112.0" class="note" text-anchor="start">Sheet 2 of 3</text>

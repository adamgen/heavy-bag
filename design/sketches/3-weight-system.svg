<text x="440.0" y="947.0" class="sm" text-anchor="start">Fabric module (dashed) or standard rigid module</text>
<text x="440.0" y="974.0" class="sm" text-anchor="start">120 grip length; ≥45 knuckle clearance; trial30/35/40 grip</text>
<text x="440.0" y="1001.0" class="sm" text-anchor="start">Captive bolts; swap unloaded with tool; fastening details TBD</text>
<text x="440.0" y="1028.0" class="lbl" text-anchor="start">DOUBLE WEIGHT HANDLE: MEANING / GEOMETRY TBD</text>
<text x="1060.0" y="70.0" class="lbl" text-anchor="start">WEIGHT INTERFACE — SOURCE LIMITS</text>
<text x="1092.0" y="100.0" class="note" text-anchor="start">One shared interface goal, two enclosure shapes. No</text>
<text x="1092.0" y="120.0" class="note" text-anchor="start">universal-fit or universal24 kg claim. Complete bag ≤30</text>
<text x="1092.0" y="140.0" class="note" text-anchor="start">kg.</text>
<circle cx="1071.0" cy="163.0" r="11" class="co"/>
<text x="1071.0" y="168.0" class="cot" text-anchor="middle">1</text>
<text x="1092.0" y="168.0" class="note" text-anchor="start">Finished95 ×100 core coating allowance gives ≤97 ×102</text>
<text x="1092.0" y="188.0" class="note" text-anchor="start">footprint. 2 mm edge and intermodule gaps. Source limits</text>
<text x="1092.0" y="208.0" class="note" text-anchor="start">in tech pack v0.2.</text>
<circle cx="1071.0" cy="231.0" r="11" class="co"/>
<text x="1071.0" y="236.0" class="cot" text-anchor="middle">2</text>
<text x="1092.0" y="236.0" class="note" text-anchor="start">Big Pack cavity299 ×314 ×58; 3×97 +2×2 +2×2 =299; 3×102</text>
<text x="1092.0" y="256.0" class="note" text-anchor="start">+2×2 +2×2 =314. 53 stack +4 clamp +1 reserve.</text>
<circle cx="1071.0" cy="279.0" r="11" class="co"/>
<text x="1071.0" y="284.0" class="cot" text-anchor="middle">3</text>
<text x="1092.0" y="284.0" class="note" text-anchor="start">Raw bar laptop380 ×100 ×10 ≈2.983 kg. Finished sleeve ≤384</text>
<text x="1092.0" y="304.0" class="note" text-anchor="start">×104 ×12. Seven layers ≈20.88 kg steel; add sleeve tare.</text>
<circle cx="1071.0" cy="327.0" r="11" class="co"/>
<text x="1071.0" y="332.0" class="cot" text-anchor="middle">4</text>
<text x="1092.0" y="332.0" class="note" text-anchor="start">Big Pack raw285 ×100 ×10 ≈2.237 kg; sleeved ≤289 ×104 ×12.</text>
<text x="1092.0" y="352.0" class="note" text-anchor="start">2 rows ×4 layers =8 pieces, ≈17.90 kg steel. Three rows</text>
<text x="1092.0" y="372.0" class="note" text-anchor="start">need320 high with gaps/edges; do not fit. Secure unused</text>
<text x="1092.0" y="392.0" class="note" text-anchor="start">space.</text>
<circle cx="1071.0" cy="415.0" r="11" class="co"/>
<text x="1071.0" y="420.0" class="cot" text-anchor="middle">5</text>
<text x="1092.0" y="420.0" class="note" text-anchor="start">Shot theoretical upper bounds before shell losses:</text>
<text x="1092.0" y="440.0" class="note" text-anchor="start">laptop13.7–17.8 kg, Big Pack18.4–23.9 kg at3.7–4.8 kg/L.</text>
<text x="1092.0" y="460.0" class="note" text-anchor="start">Real capacity is lower.</text>
<circle cx="1071.0" cy="483.0" r="11" class="co"/>
<text x="1071.0" y="488.0" class="cot" text-anchor="middle">6</text>
<text x="1092.0" y="488.0" class="note" text-anchor="start">Water/sand much lighter. Long shells must fit cavity and</text>
<text x="1092.0" y="508.0" class="note" text-anchor="start">stack including caps; nominal outside shell volume is not</text>
<text x="1092.0" y="528.0" class="note" text-anchor="start">fill capacity.</text>
<circle cx="1071.0" cy="551.0" r="11" class="co"/>
<text x="1071.0" y="556.0" class="cot" text-anchor="middle">7</text>
<text x="1092.0" y="556.0" class="note" text-anchor="start">Ruck plate229 ×292 is a candidate Big Pack footprint,</text>
<text x="1092.0" y="576.0" class="note" text-anchor="start">insert removed. Finished stack ≤53; sleeves/clamp</text>
<text x="1092.0" y="596.0" class="note" text-anchor="start">included. Not every SKU fits.</text>
<circle cx="1071.0" cy="619.0" r="11" class="co"/>
<text x="1071.0" y="624.0" class="cot" text-anchor="middle">8</text>
<text x="1092.0" y="624.0" class="note" text-anchor="start">Small gym plates ≤150 diameter are Big Pack candidates</text>
<text x="1092.0" y="644.0" class="note" text-anchor="start">only; confirm layout and stack. Laptop cavity depth106</text>
<text x="1092.0" y="664.0" class="note" text-anchor="start">cannot take them.</text>
<circle cx="1071.0" cy="687.0" r="11" class="co"/>
<text x="1071.0" y="692.0" class="cot" text-anchor="middle">9</text>
<text x="1092.0" y="692.0" class="note" text-anchor="start">Proposed supports, clamps, fasteners and coatings are</text>
<text x="1092.0" y="712.0" class="note" text-anchor="start">untested. Low-stack spacers, sealed fillers and two-grip</text>
<text x="1092.0" y="732.0" class="note" text-anchor="start">retention need POC validation.</text>
<text x="60.0" y="1090.0" class="lbl" text-anchor="start">PROVISIONAL PACKAGING ONLY — NOT ENGINEERING VALIDATED</text>

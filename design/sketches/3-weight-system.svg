<text x="214.0" y="528.0" class="sm" text-anchor="middle">4 clamp +6 reserve above stack</text>
<text x="214.0" y="800.0" class="lbl" text-anchor="middle">END SECTION — 1:2</text>
<text x="370.0" y="570.0" class="lbl" text-anchor="start">Mass and finished dimensions are separate</text>
<text x="370.0" y="602.0" class="sm" text-anchor="start">Core reference95 ×100 ×33 steel ≈2.461 kg before radii/coating.</text>
<text x="370.0" y="629.0" class="sm" text-anchor="start">Nominal2.5 /1.25 kg targets: measure finished; tune core to suit.</text>
<text x="370.0" y="656.0" class="sm" text-anchor="start">Finished full ≤97 ×102 ×35; half ≤97 ×102 ×18.</text>
<text x="370.0" y="683.0" class="sm" text-anchor="start">4 ×(2.5 +2.5 +1.25) =25 kg, not24.</text>
<text x="370.0" y="710.0" class="sm" text-anchor="start">23.75 kg example: 8 full +3 half; weigh actual whole bag.</text>
<text x="370.0" y="737.0" class="sm" text-anchor="start">88 stack +4 clamp +6 reserve =98 inner height.</text>
<text x="370.0" y="764.0" class="sm" text-anchor="start">7 sleeved bars ×12 =84 fit; 8×12 =96 do NOT fit.</text>
<text x="370.0" y="791.0" class="sm" text-anchor="start">Lower stacks require secured spacers and clamp testing.</text>
<text x="100.0" y="900.0" class="lbl" text-anchor="start">MODULAR HANDLE CONCEPT — NTS</text>

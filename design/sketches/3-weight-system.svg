<text x="780.0" y="825.0" class="cot" text-anchor="middle">4</text>
<text x="1110.0" y="70.0" class="lbl" text-anchor="start">WEIGHT SYSTEM — “ONE TRAY, ANY WEIGHT”</text>
<text x="1142.0" y="100.0" class="note" text-anchor="start">The bags sell a standard weight interface. Every weight</text>
<text x="1142.0" y="120.0" class="note" text-anchor="start">source fits the same module, so one tray (laptop bag) and</text>
<text x="1142.0" y="140.0" class="note" text-anchor="start">one carrier (Big Pack) take them all.</text>
<text x="1142.0" y="168.0" class="note" text-anchor="start">MODULE: 95 × 100 mm footprint. Laptop tray = 4 × 1</text>
<text x="1142.0" y="188.0" class="note" text-anchor="start">modules, 85 mm usable height. Big Pack carrier = 3 × 3</text>
<text x="1142.0" y="208.0" class="note" text-anchor="start">modules, 50 mm.</text>
<circle cx="1121.0" cy="231.0" r="11" class="co"/>
<text x="1121.0" y="236.0" class="cot" text-anchor="middle">1</text>
<text x="1142.0" y="236.0" class="note" text-anchor="start">Two cam straps press a clamp plate onto any stack from 10</text>
<text x="1142.0" y="256.0" class="note" text-anchor="start">to 85 mm: no rattle with any source.</text>
<circle cx="1121.0" cy="279.0" r="11" class="co"/>
<text x="1121.0" y="284.0" class="cot" text-anchor="middle">2</text>
<text x="1142.0" y="284.0" class="note" text-anchor="start">Tray end cap with pull grip and latch; slides on HDPE</text>
<text x="1142.0" y="304.0" class="note" text-anchor="start">runners. Tray: aluminium or glass-filled nylon, HDPE</text>
<text x="1142.0" y="324.0" class="note" text-anchor="start">liner.</text>
<circle cx="1121.0" cy="347.0" r="11" class="co"/>
<text x="1121.0" y="352.0" class="cot" text-anchor="middle">3</text>
<text x="1142.0" y="352.0" class="note" text-anchor="start">Clamp plate (HDPE, 4 mm).</text>
<circle cx="1121.0" cy="375.0" r="11" class="co"/>
<text x="1121.0" y="380.0" class="cot" text-anchor="middle">4</text>
<text x="1142.0" y="380.0" class="note" text-anchor="start">Fill-your-own shell: HDPE, screw cap with snap seal. Ships</text>
<text x="1142.0" y="400.0" class="note" text-anchor="start">empty; fill with steel shot (~1 kg), sand or water. Long</text>
<text x="1142.0" y="420.0" class="note" text-anchor="start">4-module shell (380 × 100 × 35) for the laptop tray holds</text>
<text x="1142.0" y="440.0" class="note" text-anchor="start">~5 kg of shot.</text>
<text x="1142.0" y="468.0" class="note" text-anchor="start">STEEL BRICK: 95 × 100 × 33 mm steel, 2.5 kg; half brick</text>
<text x="1142.0" y="488.0" class="note" text-anchor="start">16.5 mm, 1.25 kg. TPU or rubber coated, R3 edges, weight</text>
<text x="1142.0" y="508.0" class="note" text-anchor="start">laser-marked on face. No lead.</text>
<text x="1142.0" y="536.0" class="note" text-anchor="start">LOCAL STEEL BAR: 100 × 10 mm mild steel cut to 380 mm (3.0</text>
<text x="1142.0" y="556.0" class="note" text-anchor="start">kg, laptop tray) or 285 mm (2.2 kg, Big Pack). We supply</text>
<text x="1142.0" y="576.0" class="note" text-anchor="start">TPU sleeves with end caps.</text>
<text x="1142.0" y="604.0" class="note" text-anchor="start">PLATES: standard ruck plate 229 × 292 mm goes straight</text>
<text x="1142.0" y="624.0" class="note" text-anchor="start">into the Big Pack sleeve. 1" gym plates up to 150 mm</text>
<text x="1142.0" y="644.0" class="note" text-anchor="start">diameter lie flat in the Big Pack carrier. Gym plates</text>
<text x="1142.0" y="664.0" class="note" text-anchor="start">don't fit the laptop tray.</text>
<text x="1142.0" y="692.0" class="note" text-anchor="start">CAPACITY: laptop tray 24 kg with bricks or bar; ~13–16 kg</text>
<text x="1142.0" y="712.0" class="note" text-anchor="start">with shot shells. Big Pack 24 kg with any source.</text>
<text x="1110.0" y="752.0" class="lbl" text-anchor="start">LEGEND</text>
